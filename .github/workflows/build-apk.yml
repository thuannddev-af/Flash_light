name: Build Flight Release APK

on:
  workflow_dispatch:
    inputs:
      apkFileName:
        description: Tên APK, để trống thì giữ tên mặc định
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install Android SDK and signing tools
        run: >
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"

      - name: Build appProduct Release APK
        run: bash ./gradlew :app:assembleAppProductRelease --no-daemon --info

      - name: Sign APK
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APK_FILE_NAME: ${{ inputs.apkFileName }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "::error::Missing signing secret ANDROID_$name"; exit 1; }
          done
          shopt -s nullglob
          apks=(app/build/outputs/apk/appProduct/release/*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one appProduct Release APK"
            exit 1
          fi
          name="${apks[0]##*/}"
          if [[ -n "$APK_FILE_NAME" ]]; then
            if [[ ! "$APK_FILE_NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]; then
              echo "::error::Use only letters, numbers, dots, underscores or hyphens in the APK name"
              exit 1
            fi
            name="${APK_FILE_NAME%.apk}.apk"
          fi

          signing_dir=$(mktemp -d "$RUNNER_TEMP/flight-signing.XXXXXX")
          trap 'rm -f "$signing_dir/upload.jks" "$signing_dir/aligned.apk"; rmdir "$signing_dir"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_dir/upload.jks"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p signed
          "$tools/zipalign" -P 16 -f 4 "${apks[0]}" "$signing_dir/aligned.apk"
          "$tools/apksigner" sign \
            --ks "$signing_dir/upload.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "signed/$name" "$signing_dir/aligned.apk"
          "$tools/apksigner" verify "signed/$name"
          echo "apk=signed/$name" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub prerelease
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.sign.outputs.apk }}
        run: |
          version=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          code=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)
          tag="flight-apk-build-$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          url=$(gh release create "$tag" "$APK_PATH" --target "$GITHUB_SHA" \
            --title "Flight APK #$GITHUB_RUN_NUMBER - v$version ($code)" \
            --notes "Build từ commit $GITHUB_SHA" --prerelease)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Prune Flight APK prereleases older than 3 days
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '3 days ago' +'%Y-%m-%dT%H:%M:%SZ')
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.prerelease and (.tag_name | startswith(\"flight-apk-build-\")) and .created_at < \"$cutoff\") | .tag_name" |
          while IFS= read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes
          done

      - name: Notify Discord
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_URL: ${{ steps.publish.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [[ -n "$DISCORD_WEBHOOK_URL" ]] || exit 0
          if [[ "$JOB_STATUS" == "success" ]]; then
            message="Flight build thành công. APK: $RELEASE_URL"
          else
            message="Flight build $JOB_STATUS. Chi tiết: $RUN_URL"
          fi
          jq -n --arg text "$message" '{content: $text}' |
            curl --fail --silent --show-error \
              -H 'Content-Type: application/json' --data-binary @- "$DISCORD_WEBHOOK_URL"
